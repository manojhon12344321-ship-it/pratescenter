<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orçamento - Prates</title><style>*{box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff;padding:12px}.box{background:#fff;color:#000;border-radius:16px;padding:20px;max-width:500px;margin:0 auto}.topo{background:#111;color:#fff;border-radius:12px;padding:12px;text-align:center;margin-bottom:12px}.item{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between}.total{background:#ff6a00;color:#000;border-radius:10px;padding:12px;text-align:center;font-weight:900;margin-top:12px}.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:900;margin-top:8px;cursor:pointer}.btn-zap{background:#25D366;color:#fff}.btn-aprovar{background:#ff6a00;color:#000}</style></head><body><div id="conteudo" class="box">Carregando...</div><script>function getDados(){let p=new URLSearchParams(location.search).get('d');if(!p) return null;try{return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return null}}let d=getDados();if(!d){document.getElementById('conteudo').innerHTML='Orçamento não encontrado';}else{let html=`<div class="topo">🔧 <b>PRATES AUTO CENTER</b><br><small>Teixeira de Freitas - BA | 73 99846-0804</small></div><h2>Orçamento Detalhado</h2><p><b>Cliente:</b> ${d.cliente}<br><b>KM:</b> ${d.km||'-'}<br><b>Data:</b> ${new Date().toLocaleDateString('pt-BR')}</p><div style="background:#f7f7f7;border-radius:10px;padding:12px;margin:10px 0"><b>📝 O que será feito:</b><br><small>${(d.descServ||'').replace(/\n/g,'<br>')}</small></div><h3 style="color:#ff6a00">🔩 Peças / Produtos</h3>`;d.pecas.forEach(p=>{html+=`<div class="item"><div><b>${p.qtd}x ${p.nome}</b><br><small style="color:#666">Marca: ${p.marca||'-'}</small></div><b>R$ ${parseFloat(p.valor||0).toFixed(2)}</b></div>`});html+=`<div class="item"><div>Mão de obra</div><b>R$ ${parseFloat(d.mao||0).toFixed(2)}</b></div>${parseFloat(d.desconto)>0?`<div class="item" style="color:green"><div>Desconto</div><b>- R$ ${parseFloat(d.desconto).toFixed(2)}</b></div>`:''}<div class="total">TOTAL GERAL: R$ ${d.totalG}</div><div style="margin-top:12px;background:#f0f0f0;border-radius:10px;padding:10px"><small><b>Garantia:</b> ${d.garantia}<br><b>Próxima revisão:</b> ${d.prox||'-'}</small></div><button class="btn btn-aprovar" onclick="aprovar()">✅ APROVAR ORÇAMENTO</button><button class="btn btn-zap" onclick="tirarDuvida()">💬 TIRAR DÚVIDA 73 99846-0804</button><p style="text-align:center;color:#888;font-size:11px;margin-top:10px">Prates - Garantia por escrito + NF</p>`;document.getElementById('conteudo').innerHTML=html;}function aprovar(){let msg=encodeURIComponent(`✅ APROVADO! Cliente: ${d.cliente} Total: R$ ${d.totalG} - Pode começar!`);window.open('https://wa.me/5573998460804?text='+msg,'_blank')}function tirarDuvida(){let msg=encodeURIComponent(`Olá Prates, vi orçamento R$ ${d.totalG} do ${d.cliente} e tenho dúvida:`);window.open('https://wa.me/5573998460804?text='+msg,'_blank')}</script></body></html>

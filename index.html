<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Orçamento - Prates Auto Center</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f6f6]">
<header class="bg-black border-b-4 border-[#FF6B00] p-4"><div class="max-w-4xl mx-auto flex justify-between"><p class="text-white font-black text-sm">PRATES AUTO CENTER</p><a href="admin.html" class="bg-[#FF6B00] text-white text-[10px] px-3 py-1 rounded-full">ADM</a></div></header>

<div class="max-w-4xl mx-auto p-4">
<div class="bg-white rounded-[20px] p-6 shadow-sm mt-4">
<h2 class="font-black text-[16px]">🔍 Consultar meu orçamento</h2>
<p class="text-[11px] text-gray-500 mt-1">Digite seu WhatsApp com DDD (só números)</p>
<div class="flex gap-2 mt-4">
<input id="buscaWhats" class="flex-1 border-2 rounded-xl px-4 py-3 text-sm font-bold" placeholder="Ex: 73998460804">
<button onclick="buscarFirebase()" class="bg-black text-white px-6 py-3 rounded-xl font-black text-sm">BUSCAR</button>
</div>
</div>

<div id="resultado" class="hidden mt-4 bg-white rounded-[20px] overflow-hidden shadow-sm"><div id="conteudoResult"></div></div>

<div class="text-center mt-10 text-[11px] text-gray-400">📍 Teixeira de Freitas - BA | Whats: (73) 99846-0804</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDklYzIeYg6-PNwd7lGufPLyXVQaSalZlA",
  authDomain: "pratescenter.firebaseapp.com",
  projectId: "pratescenter",
  storageBucket: "pratescenter.firebasestorage.app",
  messagingSenderId: "168571076583",
  appId: "1:168571076583:web:a8fd30ec2bffa4ca4e8742"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.buscarFirebase=async()=>{
  let whats=document.getElementById('buscaWhats').value.replace(/\D/g,'');
  if(!whats){alert("Digite seu WhatsApp");return;}
  document.getElementById('resultado').classList.remove('hidden');
  document.getElementById('conteudoResult').innerHTML="<p class='p-8 text-center font-bold'>🔍 Buscando seu orçamento...</p>";
  try{
    const q=query(collection(db,"orcamentos"), where("whats","==",whats), orderBy("timestamp","desc"), limit(1));
    const snap=await getDocs(q);
    if(snap.empty){document.getElementById('conteudoResult').innerHTML="<div class='p-10 text-center'><p class='font-black'>Nenhum orçamento encontrado</p><p class='text-xs text-gray-500 mt-2'>Verifique o número: "+whats+"</p></div>";return;}
    const o=snap.docs[0].data();
    let pecasHtml=o.pecas.map(p=>`<div class="grid grid-cols-[2fr_1fr_35px_70px_70px] p-3 text-[11px] border-b items-center"><span>${p.peca}</span><span class="font-black text-[#FF6B00]">${p.marca}</span><span>${p.qtd}x</span><span>R$ ${p.valor}</span><span class="font-black">R$ ${(p.valor*p.qtd).toFixed(2)}</span></div>`).join('');
    document.getElementById('conteudoResult').innerHTML=`
      <div class="bg-[#FF6B00] p-5 text-white flex justify-between"><div><p class="text-[10px] opacity-80">ORÇAMENTO PRATES</p><p class="font-black text-[16px]">${o.cliente}</p><p class="text-[11px]">${o.veiculo}</p></div><div class="text-right"><p class="text-[10px]">Data</p><p class="font-bold text-[12px]">${o.data}</p></div></div>
      <div class="p-5">
        <p class="font-black text-[12px] border-l-4 border-[#FF6B00] pl-2 mb-2">DIAGNÓSTICO REALIZADO</p><p class="bg-gray-50 p-4 rounded-xl text-[13px] mb-5">${o.diagnostico}</p>
        <p class="font-black text-[12px] border-l-4 border-[#FF6B00] pl-2 mb-2">ITENS E PEÇAS (COM MARCA)</p><div class="border-2 rounded-xl overflow-hidden mb-5"><div class="grid grid-cols-[2fr_1fr_35px_70px_70px] bg-black text-white text-[9px] font-bold p-3"><span>ITEM</span><span>MARCA</span><span>QTD</span><span>UNIT</span><span>TOTAL</span></div>${pecasHtml}</div>
        <div class="grid grid-cols-3 gap-2 mb-5">
          <div class="border-2 border-orange-200 bg-orange-50 rounded-xl p-3 text-center"><p class="text-[8px] font-black text-gray-500">MÃO DE OBRA</p><p class="font-black text-[13px] mt-1">R$ ${o.maoObra}</p></div>
          <div class="border-2 rounded-xl p-3 text-center"><p class="text-[8px] font-black text-gray-500">PRAZO</p><p class="font-black text-[13px] mt-1">${o.prazo}</p></div>
          <div class="border-2 rounded-xl p-3 text-center"><p class="text-[8px] font-black text-gray-500">GARANTIA</p><p class="font-black text-[13px] mt-1">${o.garantia}</p></div>
        </div>
        <div class="bg-black rounded-xl p-4 text-center"><p class="text-white text-[10px]">TOTAL GERAL DO ORÇAMENTO</p><p class="text-[#FF6B00] font-black text-[22px]">R$ ${Number(o.total).toFixed(2)}</p></div>
        <a href="https://wa.me/5573998460804?text=Olá Prates! Sou ${o.cliente} (${o.veiculo}) e quero APROVAR meu orçamento de R$ ${o.total}" target="_blank" class="block w-full mt-4 bg-[#25D366] text-white font-black py-4 rounded-xl text-center text-[14px]">✅ APROVAR ORÇAMENTO NO WHATSAPP</a>
        <p class="text-center text-[10px] text-gray-400 mt-3">Orçamento válido e separado conforme solicitado: peças com marca, mão de obra, prazo e garantia</p>
      </div>`;
  }catch(e){document.getElementById('conteudoResult').innerHTML=`<p class='p-6 text-red-500 text-center text-sm'>Erro: ${e.message}<br><br>Se pedir índice, clica no link que aparece no erro para criar o índice automático no Firebase.</p>`;}
}
</script>
</body>
</html>

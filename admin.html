<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADM COMPLETO EDITÁVEL - Prates</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script><style>canvas{touch-action:none}</style></head>
<body class="bg-[#0e0e0e] text-white min-h-screen flex">
<aside class="w-[260px] bg-[#151515] border-r border-white/5 p-6 hidden lg:block fixed h-full"><div class="flex gap-3 items-center"><div class="w-10 h-10 bg-[#FF5A00] rounded-[12px] flex items-center justify-center">🛡️</div><div><p class="font-black text-[14px]">Prates Auto Center</p><p class="text-[10px] text-white/40">ADM EDITÁVEL PREMIUM</p></div></div><div class="mt-10 bg-[#FF5A00] text-white rounded-[12px] px-4 py-3 font-black text-[13px]">📊 Dashboard Editável</div><div class="absolute bottom-6 left-6 right-6 bg-[#1c1c1c] rounded-[16px] p-4"><p class="font-black text-[13px]">Carlos Prates</p><p class="text-[10px] text-[#FF5A00] font-black mt-1">CÓDIGO: <span id="codigoPreview"></span></p></div></aside>
<main class="flex-1 lg:ml-[260px] p-4 md:p-8">
<div class="flex justify-between items-center"><h1 class="text-[24px] font-black">Dashboard Editável Total</h1><div class="flex gap-2"><button onclick="exportarPlanilha()" class="bg-white text-black px-4 py-2 rounded-full font-black text-[10px]">PLANILHA</button><button onclick="carregar()" class="bg-[#1e1e1e] px-4 py-2 rounded-full font-black text-[10px] border border-white/10">ATUALIZAR</button></div></div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6"><div class="bg-[#1a1a1a] border border-white/5 rounded-[16px] p-4"><p class="text-[9px] text-white/30 font-black">ORÇAMENTOS</p><p id="kpiQtd" class="text-[22px] font-black">0</p></div><div class="bg-[#1a1a1a] border border-white/5 rounded-[16px] p-4"><p class="text-[9px] text-white/30 font-black">VALOR</p><p id="kpiValor" class="text-[18px] font-black text-[#FF5A00]">R$ 0</p></div><div class="bg-[#1a1a1a] border border-white/5 rounded-[16px] p-4"><p class="text-[9px] text-white/30 font-black">MÃO OBRA</p><p id="kpiMao" class="text-[18px] font-black">R$ 0</p></div><div class="bg-[#1a1a1a] border border-white/5 rounded-[16px] p-4"><p class="text-[9px] text-white/30 font-black">STATUS</p><p id="kpiStatus" class="text-[14px] font-black">Pendente</p></div></div>
<div class="grid lg:grid-cols-2 gap-6 mt-6">
<div class="bg-white text-black rounded-[20px] p-5 space-y-3"><div class="flex items-center gap-2"><div class="w-6 h-6 bg-black text-white rounded-full flex items-center justify-center font-black text-[10px]">1</div><p class="font-black text-[12px]">Dados Cliente</p></div>
<div class="grid grid-cols-2 gap-3"><div><label class="text-[8px] font-black text-[#FF5A00]">CÓDIGO EDITÁVEL</label><input id="codigo" class="w-full mt-1 bg-white border-2 border-orange-200 text-[#FF5A00] font-black rounded-[10px] p-2.5 text-[12px]" oninput="document.getElementById('codigoPreview').innerText=this.value"></div><div><label class="text-[8px] font-black text-gray-400">STATUS</label><select id="statusOrc" class="w-full mt-1 border-2 border-gray-100 rounded-[10px] p-2.5 font-black text-[11px]"><option>Pendente</option><option>Aprovado</option><option>Em Execução</option><option>Finalizado</option><option>Pago</option><option>Reprovado</option></select></div></div>
<input id="cliente" placeholder="Nome cliente *" class="border-2 border-gray-100 rounded-[10px] p-3 text-[12px] font-bold w-full"><div class="grid grid-cols-2 gap-2"><input id="whats" placeholder="WhatsApp *" class="border-2 border-gray-100 rounded-[10px] p-3 text-[12px] font-black"><input id="veiculo" placeholder="Veículo/Placa *" class="border-2 border-gray-100 rounded-[10px] p-3 text-[12px]"></div><div class="grid grid-cols-3 gap-2"><input id="km" placeholder="KM" class="border-2 border-gray-100 rounded-[10px] p-2.5 text-[11px]"><input id="entrada" type="date" class="border-2 border-gray-100 rounded-[10px] p-2.5 text-[11px]"><input id="mecanico" placeholder="Mecânico" class="border-2 border-gray-100 rounded-[10px] p-2.5 text-[11px]"></div>
<label class="text-[9px] font-black text-gray-400">FOTOS</label><input id="fotos" type="file" accept="image/*" multiple class="w-full border-2 border-dashed border-orange-200 bg-[#FFF7F0] rounded-[10px] p-2 text-[10px]"><div id="previewFotos" class="flex gap-2 flex-wrap"></div>
<textarea id="diagnostico" rows="2" placeholder="Diagnóstico técnico" class="w-full border-2 border-gray-100 rounded-[10px] p-3 text-[12px]"></textarea>
</div>
<div class="bg-white text-black rounded-[20px] p-5 space-y-3"><div class="flex justify-between"><div class="flex items-center gap-2"><div class="w-6 h-6 bg-[#FF5A00] text-white rounded-full flex items-center justify-center font-black text-[10px]">2</div><p class="font-black text-[12px]">Peças com MARCA</p></div><span id="contador" class="bg-orange-100 text-[#FF5A00] text-[9px] font-black px-2 py-1 rounded-full">0 peças</span></div><div id="lista" class="space-y-2 max-h-[240px] overflow-auto"></div><button onclick="addPeca()" class="w-full bg-black text-white rounded-[10px] py-2.5 font-black text-[10px]">+ ADICIONAR PEÇA COM MARCA SEPARADA</button>
<div class="grid grid-cols-3 gap-2">
<div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-2.5"><label class="text-[7px] font-black text-[#FF5A00]">MÃO OBRA EDITÁVEL</label><input id="mao" type="number" value="80" oninput="calc()" class="w-full bg-transparent font-black text-[14px] outline-none"></div>
<div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-2.5"><label class="text-[7px] font-black text-[#FF5A00]">PRAZO EDITÁVEL</label><input id="prazo" list="listaPrazo" value="2 horas" class="w-full bg-transparent font-black text-[11px] outline-none"><datalist id="listaPrazo"><option value="30 minutos"><option value="1 hora"><option value="2 horas"><option value="4 horas"><option value="1 dia"><option value="2 dias"><option value="3 dias"></datalist></div>
<div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-2.5"><label class="text-[7px] font-black text-[#FF5A00]">GARANTIA EDITÁVEL</label><input id="garantia" list="listaGarantia" value="90 dias" class="w-full bg-transparent font-black text-[11px] outline-none"><datalist id="listaGarantia"><option value="30 dias"><option value="60 dias"><option value="90 dias"><option value="6 meses"><option value="1 ano"></datalist></div>
</div>
<div class="grid grid-cols-3 gap-2">
<div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-2.5"><label class="text-[7px] font-black text-[#FF5A00]">VALIDADE EDITÁVEL</label><input id="validade" list="listaValidade" value="7 dias" class="w-full bg-transparent font-black text-[11px] outline-none"><datalist id="listaValidade"><option value="1 dia"><option value="2 dias"><option value="3 dias"><option value="5 dias"><option value="7 dias"><option value="10 dias"><option value="15 dias"><option value="30 dias"></datalist></div>
<div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-2.5"><label class="text-[7px] font-black text-[#FF5A00]">PAGAMENTO EDITÁVEL</label><input id="pagamento" list="listaPagamento" value="Pix" class="w-full bg-transparent font-black text-[10px] outline-none" placeholder="Pix, 12x..."><datalist id="listaPagamento"><option value="Pix"><option value="Pix com 5% desconto"><option value="Dinheiro"><option value="Dinheiro com 10% desconto"><option value="Cartão 1x"><option value="Cartão 3x sem juros"><option value="Cartão 5x sem juros"><option value="Cartão 6x sem juros"><option value="Cartão 12x com juros"><option value="50% entrada + 50% Pix"></datalist></div>
<div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-2.5"><label class="text-[7px] font-black text-[#FF5A00]">DESCONTO R$</label><input id="desconto" type="number" value="0" oninput="calc()" class="w-full bg-transparent font-black text-[13px] outline-none"></div>
</div>
<div class="bg-black text-white rounded-[14px] p-3 text-center"><p class="text-[8px] tracking-[2px] opacity-50">TOTAL GERAL</p><p id="total" class="text-[26px] font-black text-[#FF5A00]">R$ 0,00</p></div>
<div class="bg-[#f9f9f9] border rounded-[12px] p-2.5"><label class="text-[9px] font-black">ASSINATURA CLIENTE</label><canvas id="canvasAss" class="w-full h-[100px] bg-white border-2 border-dashed rounded-[10px] mt-2"></canvas><div class="flex gap-2 mt-2"><button onclick="limparAss()" class="flex-1 bg-gray-200 rounded-[8px] py-2 text-[9px] font-black">LIMPAR</button><button onclick="salvarAss()" class="flex-1 bg-black text-white rounded-[8px] py-2 text-[9px] font-black">SALVAR</button></div></div>
</div>
</div>
<div class="grid md:grid-cols-3 gap-3 mt-6"><button onclick="salvar()" class="bg-[#FF5A00] rounded-[14px] py-4 font-black text-[12px]">💾 SALVAR + PDF PREMIUM</button><button onclick="enviarZap()" class="bg-[#25D366] rounded-[14px] py-4 font-black text-[12px]">💬 WHATSAPP</button><button onclick="gerarLinkAprovacao()" class="bg-white text-black rounded-[14px] py-4 font-black text-[12px]">🔗 LINK APROVAÇÃO</button></div>
<div class="bg-[#1a1a1a] rounded-[20px] p-5 mt-6 border border-white/5"><h3 class="font-black text-[13px]">📋 Planilha Profissional</h3><div id="tabela" class="mt-4 space-y-2 max-h-[400px] overflow-auto"></div></div>
<p id="status" class="text-center font-black mt-4 text-[#FF5A00] text-[12px]"></p>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDklYzIeYg6-PNwd7lGufPLyXVQaSalZlA", authDomain: "pratescenter.firebaseapp.com", projectId: "pratescenter", storageBucket: "pratescenter.firebasestorage.app", messagingSenderId: "168571076583", appId: "1:168571076583:web:a8fd30ec2bffa4ca4e8742" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let pecas=[], fotosBase64=[], assinaturaBase64=''; let contadorOR=Math.floor(Math.random()*900)+100; document.getElementById('codigo').value=`OR-${new Date().getFullYear()}-${contadorOR}`; document.getElementById('codigoPreview').innerText=document.getElementById('codigo').value;
window.addPeca=(n='',m='',q=1,v=0)=>{pecas.push({peca:n,marca:m,qtd:q,valor:v}); render();}; window.render=()=>{const l=document.getElementById('lista'); l.innerHTML=''; document.getElementById('contador').innerText=`${pecas.length} peças`; pecas.forEach((p,i)=>{l.innerHTML+=`<div class='bg-[#f7f7f7] border rounded-[12px] p-2.5'><div class='grid grid-cols-2 gap-2'><input value='${p.peca}' oninput='pecas[${i}].peca=this.value' placeholder='Peça' class='border bg-white rounded-[8px] p-2 text-[11px] font-bold'><input value='${p.marca}' oninput='pecas[${i}].marca=this.value' placeholder='MARCA SEPARADA *' class='border-2 border-orange-200 bg-[#FFF7F0] rounded-[8px] p-2 text-[11px] font-black'></div><div class='grid grid-cols-[40px_70px_1fr] gap-2 mt-2'><input type='number' value='${p.qtd}' oninput='pecas[${i}].qtd=parseInt(this.value)||1;calc()' class='border bg-white rounded-[8px] p-2 text-center font-black text-[11px]'><input type='number' value='${p.valor}' oninput='pecas[${i}].valor=parseFloat(this.value)||0;calc()' class='border bg-white rounded-[8px] p-2 font-black text-[11px]'><button onclick='remover(${i})' class='bg-red-50 text-red-500 border rounded-[8px] text-[8px] font-black'>🗑️ REMOVER</button></div></div>`}); calc();}; window.remover=(i)=>{pecas.splice(i,1); render();}; window.calc=()=>{let tp=pecas.reduce((s,p)=>s+(p.valor*p.qtd),0); let mo=parseFloat(document.getElementById('mao').value)||0; let desc=parseFloat(document.getElementById('desconto').value)||0; document.getElementById('total').innerText=`R$ ${(tp+mo-desc).toFixed(2)}`; document.getElementById('kpiValor').innerText=`R$ ${(tp+mo-desc).toFixed(0)}`; document.getElementById('kpiMao').innerText=`R$ ${mo.toFixed(0)}`; document.getElementById('kpiQtd').innerText=pecas.length; document.getElementById('kpiStatus').innerText=document.getElementById('statusOrc').value;};
document.getElementById('fotos').addEventListener('change',(e)=>{fotosBase64=[]; document.getElementById('previewFotos').innerHTML=''; for(let file of e.target.files){let r=new FileReader(); r.onload=()=>{fotosBase64.push(r.result); let img=document.createElement('img'); img.src=r.result; img.className='w-14 h-14 rounded-[8px] object-cover border'; document.getElementById('previewFotos').appendChild(img);}; r.readAsDataURL(file);}});
const canvas=document.getElementById('canvasAss'); const ctx=canvas.getContext('2d'); let des=false; function rs(){canvas.width=canvas.offsetWidth*2; canvas.height=100*2; ctx.scale(2,2); ctx.lineWidth=2; ctx.lineCap='round';} rs(); canvas.addEventListener('pointerdown',e=>{des=true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY);}); canvas.addEventListener('pointermove',e=>{if(!des)return; ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();}); window.addEventListener('pointerup',()=>des=false); window.limparAss=()=>{ctx.clearRect(0,0,canvas.width,canvas.height); assinaturaBase64='';}; window.salvarAss=()=>{assinaturaBase64=canvas.toDataURL(); alert('Assinatura salva!');};
window.gerarPDF=(d)=>{const {jsPDF}=window.jspdf; const doc=new jsPDF(); const laranja=[255,90,0]; const preto=[14,14,14]; doc.setFillColor(...preto); doc.rect(0,0,210,28,'F'); doc.setFillColor(...laranja); doc.rect(0,28,210,1.5,'F'); doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont('helvetica','bold'); doc.text('PRATES AUTO CENTER',14,14); doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.text('OFICINA PREMIUM • TEIXEIRA DE FREITAS - BA • 73 99846-0804',14,19); doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...laranja); doc.text(d.codigo, 150, 14); doc.setTextColor(255,255,255); doc.setFontSize(7); doc.text(`DATA: ${d.data} | STATUS: ${d.status}`,150,19); doc.setFillColor(245,246,248); doc.roundedRect(14,33,182,22,3,3,'F'); doc.setTextColor(0,0,0); doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.text(`CLIENTE: ${d.cliente.toUpperCase()}`,16,40); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text(`Veículo: ${d.veiculo} | KM: ${d.km} | Whats: ${d.whats} | Mecânico: ${d.mecanico}`,16,45); doc.text(`Validade: ${d.validade} | Pagamento: ${d.pagamento} | Garantia: ${d.garantia} | Prazo: ${d.prazo}`,16,50); let body=d.pecas.map(p=>[p.peca.toUpperCase(), p.marca.toUpperCase(), p.qtd, `R$ ${Number(p.valor).toFixed(2)}`, `R$ ${(p.valor*p.qtd).toFixed(2)}`]); doc.autoTable({startY:58, head:[['PEÇA / SERVIÇO','MARCA SEPARADA','QTD','VALOR UNIT.','TOTAL']], body:body, headStyles:{fillColor:laranja, textColor:255, fontSize:8, fontStyle:'bold'}, bodyStyles:{fontSize:8}, alternateRowStyles:{fillColor:[255,247,240]}, columnStyles:{1:{fontStyle:'bold', textColor:laranja}}}); let y=doc.lastAutoTable.finalY+8; doc.setFillColor(...preto); doc.roundedRect(14,y,182,22,4,4,'F'); doc.setTextColor(200,200,200); doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.text('MÃO DE OBRA SEPARADA',16,y+7); doc.text('DESCONTO',16,y+13); doc.text('TOTAL GERAL',16,y+19); doc.setTextColor(...laranja); doc.text(`R$ ${Number(d.maoObra).toFixed(2)}`,160,y+7); doc.setTextColor(255,255,255); doc.text(`R$ ${Number(d.desconto).toFixed(2)}`,160,y+13); doc.setTextColor(...laranja); doc.setFontSize(12); doc.text(`R$ ${Number(d.total).toFixed(2)}`,150,y+19); y+=30; doc.setTextColor(0,0,0); doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.text('DIAGNÓSTICO TÉCNICO',14,y); doc.setFont('helvetica','normal'); doc.setFontSize(8); let diag = doc.splitTextToSize(d.diagnostico || 'Sem diagnóstico', 182); doc.text(diag,14,y+5); y+= 10 + (diag.length*4); if(d.fotos && d.fotos.length>0){doc.setFont('helvetica','bold'); doc.text('FOTOS DO DIAGNÓSTICO',14,y); y+=4; d.fotos.forEach((f,i)=>{try{ doc.addImage(f,'JPEG',14 + (i*55), y, 50, 35); }catch(e){}}); y+=40;} if(d.assinatura){doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.text('ASSINATURA CLIENTE:',14,y); try{ doc.addImage(d.assinatura,'PNG',14,y+2,50,15); }catch(e){} doc.setDrawColor(0); doc.line(14,y+18,74,y+18); doc.text('ASSINATURA OFICINA: ___________________',110,y+10);} doc.setFillColor(...laranja); doc.rect(0,285,210,12,'F'); doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.text('GARANTIA DE 90 DIAS PARA OS SERVIÇOS REALIZADOS • ORÇAMENTO VÁLIDO • SUJEITO À REVISÃO APÓS APROVAÇÃO',14,292); doc.save(`${d.codigo}_${d.cliente}.pdf`);};
window.salvar=async()=>{const dados={codigo:document.getElementById('codigo').value, cliente:document.getElementById('cliente').value, whats:document.getElementById('whats').value.replace(/\D/g,''), veiculo:document.getElementById('veiculo').value, km:document.getElementById('km').value, entrada:document.getElementById('entrada').value, mecanico:document.getElementById('mecanico').value, status:document.getElementById('statusOrc').value, diagnostico:document.getElementById('diagnostico').value, maoObra:document.getElementById('mao').value, prazo:document.getElementById('prazo').value, garantia:document.getElementById('garantia').value, validade:document.getElementById('validade').value, pagamento:document.getElementById('pagamento').value, desconto:document.getElementById('desconto').value, pecas:pecas, fotos:fotosBase64.slice(0,2), assinatura:assinaturaBase64, total:pecas.reduce((s,p)=>s+p.valor*p.qtd,0)+(parseFloat(document.getElementById('mao').value)||0)-(parseFloat(document.getElementById('desconto').value)||0), data:new Date().toLocaleString('pt-BR'), timestamp:Date.now()}; if(!dados.cliente||!dados.whats){alert('Preencha cliente e WhatsApp');return;} document.getElementById('status').innerText='Salvando...'; await addDoc(collection(db,'orcamentos'),dados); document.getElementById('status').innerText='✅ SALVO!'; gerarPDF(dados); carregar();};
window.enviarZap=()=>{const z=document.getElementById('whats').value.replace(/\D/g,''); if(!z)return; const msg=`*${document.getElementById('codigo').value} - PRATES*\nOlá ${document.getElementById('cliente').value}! Seu orçamento: ${document.getElementById('total').innerText}\nPagamento: ${document.getElementById('pagamento').value}\nValidade: ${document.getElementById('validade').value}`; window.open(`https://wa.me/55${z}?text=${encodeURIComponent(msg)}`,'_blank');};
window.gerarLinkAprovacao=()=>{const z=document.getElementById('whats').value.replace(/\D/g,''); const link=`https://manojhon12344321-ship-it.github.io/pratescenter/?aprovacao=${document.getElementById('codigo').value}&zap=${z}`; prompt('Link aprovação:',link);};
window.carregar=async()=>{const snap=await getDocs(query(collection(db,'orcamentos'), orderBy('timestamp','desc'), limit(40))); let html=''; snap.forEach(o=>{const d=o.data(); html+=`<div class='bg-white text-black rounded-[12px] p-3 flex justify-between'><div><p class='font-black text-[11px]'>${d.codigo} - ${d.cliente}</p><p class='text-[9px] text-gray-500'>R$ ${d.total.toFixed(2)} | ${d.status} | ${d.pagamento}</p></div><p class='text-[9px] font-bold'>${d.whats}</p></div>`}); document.getElementById('tabela').innerHTML=html;};
window.exportarPlanilha=async()=>{const snap=await getDocs(collection(db,'orcamentos')); let csv='Codigo,Cliente,Whats,Veiculo,KM,Status,Total,MaoObra,Desconto,Validade,Pagamento,Peca,Marca\n'; snap.forEach(d=>{const o=d.data(); o.pecas.forEach(p=>{csv+=`"${o.codigo}","${o.cliente}","${o.whats}","${o.veiculo}","${o.km}","${o.status}",${o.total},${o.maoObra},${o.desconto},"${o.validade}","${o.pagamento}","${p.peca}","${p.marca}"\n`})}); const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`PLANILHA_PRATES_${Date.now()}.csv`; a.click();};
addPeca('Pastilha Freio','Frasle',1,180); calc(); carregar(); document.getElementById('statusOrc').addEventListener('change',calc);
</script>
</body>
</html>

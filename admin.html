<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM Prates - PDF Premium</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head>
<body class="bg-[#0f0f0f] text-white p-3">
<div class="max-w-[1200px] mx-auto grid md:grid-cols-[1fr_380px] gap-4">
<div class="space-y-3">
<div class="bg-white text-black rounded-[20px] p-5"><p class="font-black text-[12px]">1. Cliente e Veículo</p><div class="grid grid-cols-2 gap-2 mt-3"><input id="nome" placeholder="Nome Cliente *" class="border rounded-[10px] p-3 text-[12px] font-bold"><input id="zap" placeholder="Whats *" class="border rounded-[10px] p-3 text-[12px]"><input id="veiculo" placeholder="Veículo *" class="border rounded-[10px] p-3 text-[12px]"><input id="placa" placeholder="Placa *" class="border rounded-[10px] p-3 text-[12px]"><input id="km" placeholder="KM" class="border rounded-[10px] p-3 text-[12px]"><input id="servico" placeholder="Serviço" class="border rounded-[10px] p-3 text-[12px]"></div></div>
<div class="bg-white text-black rounded-[20px] p-5 space-y-3"><div class="flex justify-between"><p class="font-black text-[12px]">2. Peças com MARCA Separada</p><span id="contador" class="bg-orange-100 text-[#FF5A00] text-[9px] font-black px-3 py-1 rounded-full">0</span></div><div id="lista" class="space-y-3 max-h-[380px] overflow-auto"></div><button onclick="addPeca()" class="w-full bg-black text-white rounded-[12px] py-3 font-black text-[10px]">+ ADICIONAR PEÇA COM MARCA SEPARADA</button>
<div class="grid grid-cols-3 gap-2"><div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-3"><label class="text-[7px] font-black text-[#FF5A00]">MÃO DE OBRA ESPECIFICADA</label><input id="mao" type="number" value="150" oninput="calc()" class="w-full bg-transparent font-black outline-none"></div><div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-3"><label class="text-[7px] font-black text-[#FF5A00]">PRAZO ENTREGA</label><input id="prazo" value="2 horas" class="w-full bg-transparent font-black text-[12px] outline-none"></div><div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-3"><label class="text-[7px] font-black text-[#FF5A00]">GARANTIA</label><input id="garantia" value="90 dias nos serviços e peças" class="w-full bg-transparent font-black text-[11px] outline-none"></div><div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-3"><label class="text-[7px] font-black text-[#FF5A00]">PAGAMENTO</label><input id="pagamento" value="Pix / Cartão / Dinheiro" class="w-full bg-transparent font-black text-[11px] outline-none"></div><div class="bg-[#FFF0E6] border-2 border-orange-200 rounded-[12px] p-3"><label class="text-[7px] font-black text-[#FF5A00]">VALIDADE</label><input id="validade" value="7 dias" class="w-full bg-transparent font-black text-[11px] outline-none"></div><div class="bg-black text-white rounded-[12px] p-3 flex flex-col justify-center"><p class="text-[8px] opacity-50">TOTAL GERAL</p><p id="total" class="text-[18px] font-black text-[#FF5A00]">R$ 0,00</p></div></div>
</div>
</div>
<div class="bg-white text-black rounded-[20px] p-5 h-fit sticky top-3"><h3 class="font-black text-[12px]">Prévia</h3><div id="previa" class="bg-[#f5f5f5] rounded-[12px] p-3 text-[11px] whitespace-pre-wrap mt-3 min-h-[150px]">Preencha...</div><button onclick="gerarPDF()" class="w-full bg-black text-white rounded-[12px] py-4 font-black mt-3">📄 GERAR PDF PREMIUM COM MARCA</button><button onclick="enviarZap()" class="w-full bg-[#25D366] text-white rounded-[12px] py-3 font-black mt-2 text-[12px]">📲 ENVIAR NO ZAP</button><p class="text-[8px] text-center opacity-40 mt-2">PDF já sai com marca separada destacada igual da imagem</p></div>
</div>
<script>
let pecas=[];function addPeca(){pecas.push({peca:'',marca:'',tipo:'Freio',qtd:1,valor:0});render();}function remover(i){pecas.splice(i,1);render();}
function render(){let l=document.getElementById('lista');l.innerHTML='';document.getElementById('contador').innerText=pecas.length+' peças';pecas.forEach((p,i)=>{l.innerHTML+=`<div class='bg-[#f9f9f9] border rounded-[12px] p-3'><div class='grid grid-cols-2 gap-2'><input value='${p.peca}' oninput='pecas[${i}].peca=this.value;calc()' placeholder='Peça: Pastilha Freio Dianteira' class='border bg-white rounded-[8px] p-2 text-[11px] font-bold'><input value='${p.marca}' oninput='pecas[${i}].marca=this.value;calc()' placeholder='MARCA: Brembo' class='border-2 border-orange-200 bg-[#FFF7F0] rounded-[8px] p-2 text-[11px] font-black'></div><div class='grid grid-cols-3 gap-2 mt-2'><select onchange='pecas[${i}].tipo=this.value;calc()' class='border bg-white rounded-[8px] p-2 text-[10px]'><option>Freio</option><option>Motor</option><option>Lubrificante</option><option>Suspensão</option><option>Original</option><option>Genuína</option><option>Paralela 1ª Linha</option></select><input type='number' value='${p.qtd}' oninput='pecas[${i}].qtd=parseInt(this.value)||1;calc()' class='border bg-white rounded-[8px] p-2 text-center font-black'><input type='number' value='${p.valor}' oninput='pecas[${i}].valor=parseFloat(this.value)||0;calc()' placeholder='Valor' class='border bg-white rounded-[8px] p-2 font-black'></div><button onclick='remover(${i})' class='mt-2 text-[8px] text-red-500 font-black'>🗑️ REMOVER</button></div>`});calc();}
function calc(){let tp=pecas.reduce((a,b)=>a+(b.valor*b.qtd),0);let mo=parseFloat(document.getElementById('mao').value)||0;let total=tp+mo;document.getElementById('total').innerText='R$ '+total.toFixed(2);let nome=document.getElementById('nome').value||'[NOME]';let veiculo=document.getElementById('veiculo').value||'[VEÍCULO]';let placa=document.getElementById('placa').value||'[PLACA]';let txt=`${nome}\n${veiculo} | ${placa}\n\n`;pecas.forEach(p=>{txt+=`${p.peca} | MARCA:${p.marca} | R$ ${(p.valor*p.qtd).toFixed(2)}\n`});txt+=`\nTOTAL R$ ${total.toFixed(2)}`;document.getElementById('previa').innerText=txt;}
function enviarZap(){let txt=document.getElementById('previa').innerText;let zap=document.getElementById('zap').value;let num=zap?`55${zap.replace(/\D/g,'')}`:'5573998460804';window.open(`https://wa.me/${num}?text=${encodeURIComponent(txt)}`,'_blank');}
async function gerarPDF(){
const {jsPDF}=window.jspdf;const doc=new jsPDF();const W=210;
doc.setFillColor(15,15,15);doc.rect(0,0,W,38,'F');
doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(255,90,0);doc.text('PRATES',12,18);doc.text('AUTO CENTER',12,28);
doc.setFontSize(11);doc.setTextColor(255,255,255);doc.text('FATURA / INVOICE',W-12,16,{align:'right'});doc.setFontSize(9);doc.setTextColor(180,180,180);doc.text('Nº INV-'+Date.now().toString().slice(-4),W-12,22,{align:'right'});doc.text('Data: '+(new Date().toLocaleDateString('pt-BR')),W-12,27,{align:'right'});
let y=48;doc.setFillColor(240,240,240);doc.roundedRect(10,y,90,32,2,2,'F');doc.roundedRect(110,y,90,32,2,2,'F');
doc.setFontSize(9);doc.setTextColor(0,0,0);doc.setFont('helvetica','bold');doc.text('INFORMAÇÕES DO CLIENTE',12,y+6);doc.text('INFORMAÇÕES DO VEÍCULO',112,y+6);
doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(`Nome: ${document.getElementById('nome').value}`,12,y+12);doc.text(`Telefone: ${document.getElementById('zap').value}`,12,y+17);doc.text(`Veículo: ${document.getElementById('veiculo').value}`,112,y+12);doc.text(`Placa: ${document.getElementById('placa').value}`,112,y+17);doc.text(`KM: ${document.getElementById('km').value}`,112,y+22);doc.text(`Serviço: ${document.getElementById('servico').value}`,112,y+27);
y+=42;doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('DETALHAMENTO DOS ITENS / SERVIÇOS',12,y);y+=6;
doc.setFillColor(255,90,0);doc.rect(10,y,190,10,'F');doc.setTextColor(255,255,255);doc.setFontSize(8);doc.text('Peça',12,y+6);doc.text('Marca Separada',42,y+6);doc.text('Tipo',82,y+6);doc.text('Qtd',112,y+6);doc.text('Valor',132,y+6);doc.text('Subtotal',162,y+6);
y+=10;doc.setTextColor(0,0,0);doc.setFont('helvetica','normal');let tp=0;pecas.forEach(p=>{let sub=p.valor*p.qtd;tp+=sub;if(y>260){doc.addPage();y=15;}doc.setFillColor(245,245,245);if(pecas.indexOf(p)%2==0)doc.rect(10,y,190,8,'F');doc.text((p.peca||'').substring(0,20),12,y+5);doc.setFont('helvetica','bold');doc.text((p.marca||'').substring(0,15),42,y+5);doc.setFont('helvetica','normal');doc.text(p.tipo,82,y+5);doc.text(String(p.qtd),112,y+5);doc.text('R$ '+p.valor.toFixed(2),132,y+5);doc.text('R$ '+sub.toFixed(2),162,y+5);y+=8;});
let mo=parseFloat(document.getElementById('mao').value)||0;let total=tp+mo;y+=2;doc.setFillColor(240,240,240);doc.rect(10,y,190,20,'F');doc.setFontSize(9);doc.text('Subtotal: R$ '+tp.toFixed(2),W-12,y+5,{align:'right'});doc.text('Mão de Obra: R$ '+mo.toFixed(2),W-12,y+10,{align:'right'});doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(255,90,0);doc.text('TOTAL: R$ '+total.toFixed(2),W-12,y+17,{align:'right'});
y+=30;doc.setDrawColor(0);doc.roundedRect(10,y,190,28,2,2,'S');doc.setTextColor(0,0,0);doc.setFontSize(7);doc.setFont('helvetica','bold');doc.text('PRATES AUTO CENTER',12,y+7);doc.setFont('helvetica','normal');doc.text('Teixeira de Freitas BA | (73) 99846-0804',12,y+12);doc.text(`Condições: ${document.getElementById('pagamento').value}`,70,y+7);doc.text(`Prazo: ${document.getElementById('prazo').value}`,70,y+12);doc.text(`Garantia: ${document.getElementById('garantia').value}`,130,y+7);doc.text(`Validade: ${document.getElementById('validade').value}`,130,y+12);
y+=38;doc.setFontSize(6);doc.setTextColor(100,100,100);doc.text('Documento gerado em '+new Date().toLocaleString('pt-BR')+' • Obrigado por confiar na PRATES AUTO CENTER!',W/2,y,{align:'center'});
doc.save(`ORCAMENTO-PREMIUM-${document.getElementById('nome').value||'cliente'}.pdf`);
}
addPeca();
</script>
</body></html>
